name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TFM: net8.0-windows10.0.19041.0

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # полная история — нужна для вычисления SemVer по коммитам

      # SemVer по Conventional Commits:
      #   fix: … / perf: …      -> patch
      #   feat: …               -> minor
      #   BREAKING CHANGE / !   -> major
      #   прочие коммиты        -> patch (default_bump)
      - name: Compute next version (dry run)
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          dry_run: true

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish x64
        run: >
          dotnet publish FolderDock.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:Version=${{ steps.semver.outputs.new_version }}

      - name: Publish ARM64
        run: >
          dotnet publish FolderDock.csproj
          -c Release -r win-arm64 -p:Platform=ARM64
          -p:Version=${{ steps.semver.outputs.new_version }}

      - name: Pack artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.semver.outputs.new_version }}"
          Compress-Archive -Path "bin\x64\Release\$env:TFM\win-x64\publish\*" `
            -DestinationPath "FolderDock-$v-win-x64.zip"
          Compress-Archive -Path "bin\ARM64\Release\$env:TFM\win-arm64\publish\*" `
            -DestinationPath "FolderDock-$v-win-arm64.zip"

      - name: Create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: FolderDock ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: |
            FolderDock-*-win-x64.zip
            FolderDock-*-win-arm64.zip
