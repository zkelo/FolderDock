name: Tests and build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test popup session rules
        run: dotnet test tests/FolderDock.Core.Tests/FolderDock.Core.Tests.csproj --configuration Release

  windows-build:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WinUI application
        run: dotnet build FolderDock.csproj -c Release -r win-x64 -p:Platform=x64
