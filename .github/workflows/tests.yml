name: Tests and build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test application rules and dependency boundaries
        run: dotnet test tests/FolderDock.Core.Tests/FolderDock.Core.Tests.csproj --configuration Release
      - name: Test infrastructure adapters
        run: dotnet test tests/FolderDock.Infrastructure.Tests/FolderDock.Infrastructure.Tests.csproj --configuration Release

  windows-build:
    name: Windows ${{ matrix.platform }} build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
          - platform: ARM64
            runtime: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish WinUI application with ReadyToRun
        run: >
          dotnet publish FolderDock.csproj -c Release
          -r ${{ matrix.runtime }} -p:Platform=${{ matrix.platform }}
          --output "${{ runner.temp }}/FolderDock-${{ matrix.runtime }}"
      - name: Test Windows filesystem behavior
        if: matrix.platform == 'x64'
        run: |
          dotnet test tests/FolderDock.Core.Tests/FolderDock.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/FolderDock.Infrastructure.Tests/FolderDock.Infrastructure.Tests.csproj -c Release
      - name: Validate installer
        shell: pwsh
        run: >
          iscc installer\FolderDock.iss /DVersion=0.0.0
          /DArch=${{ matrix.platform == 'ARM64' && 'arm64' || 'x64' }}
          /DSourceDir="${{ runner.temp }}/FolderDock-${{ matrix.runtime }}"
      - name: Upload portable test build
        uses: actions/upload-artifact@v4
        with:
          name: FolderDock-${{ matrix.runtime }}
          path: ${{ runner.temp }}/FolderDock-${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 14
