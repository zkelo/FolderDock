name: Clean up PR builds

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  schedule:
    - cron: '8,23,38,53 * * * *'

permissions: {}

jobs:
  cleanup:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Delete builds belonging to closed PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repository = context.repo;
            const closedNumber = context.eventName === 'pull_request' ? context.issue.number : null;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...repository, per_page: 100
            });

            async function ignoreNotFound(request) {
              try {
                return await request;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const states = new Map();
            for (const artifact of artifacts) {
              const match = /^FolderDock-PR-([1-9]\d*)-win-(?:x64|arm64)-(?:portable|installer)-\d+-\d+$/.exec(artifact.name);
              if (!match) continue;
              const number = Number(match[1]);
              if (!Number.isSafeInteger(number) || (closedNumber !== null && number !== closedNumber)) continue;

              if (!states.has(number)) {
                const response = await ignoreNotFound(github.rest.pulls.get({
                  ...repository, pull_number: number
                }));
                states.set(number, response?.data.state);
              }
              if (states.get(number) !== 'closed') continue;

              const deleted = await ignoreNotFound(github.rest.actions.deleteArtifact({
                ...repository, artifact_id: artifact.id
              }));
              if (deleted) core.info(`Deleted ${artifact.name}`);
            }
